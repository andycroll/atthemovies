    schedule: every day at 3am Europe/London
  import_light:
    class: ImportChainJob
    args: [ "light" ]
    schedule: every day at 3:15am Europe/London
  import_everyman:
    class: ImportChainJob
    args: [ "everyman" ]
    schedule: every day at 3:30am Europe/London
  import_showcase:
    class: ImportChainJob
    args: [ "showcase" ]
    schedule: every day at 3:45am Europe/London
