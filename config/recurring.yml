    class: ImportChainJob
    args: [ "arc" ]
    schedule: every day at 12:45am Europe/London
  import_moviehouse:
    class: ImportChainJob
    args: [ "moviehouse" ]
    schedule: every day at 12:20am Europe/London
  import_omniplex:
    class: ImportChainJob
    args: [ "omniplex" ]
    schedule: every day at 12:05am Europe/London
  import_reel:
    class: ImportChainJob
    args: [ "reel" ]
    schedule: every day at 12:10am Europe/London
