version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    patch-updates:
      update-types: [ "patch" ]
    minor-updates:
      update-types: [ "minor" ]
  cooldown:
    default-days: 3
    semver-major-days: 7
    semver-minor-days: 5
    semver-patch-days: 3
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
